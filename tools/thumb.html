<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>thumb</title>
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Thumb v3 da Poki: mostra o puzzle, nao so o trem. A v2 (trem subindo uma
// rampa) nao dizia o que se faz no jogo. Agora e um quadro de uma partida de
// verdade, com o cenario e as pecas do proprio jogo:
//   - um trem pronto (locomotiva, sinal verde, fumaca): o objetivo;
//   - um bloco da mesma cor no ar, preso pela mao, com o rastro de onde saiu;
//   - o destino brilhando, com o fantasma onde o bloco vai engatar;
//   - o resto do patio com cores misturadas: o que falta separar.
// Regras (developers.poki.com/guide/game-thumbnail): 1:1, sangrada, sem texto,
// um objeto principal, sugerir movimento, contraste com o fundo #83FFE7 do
// site, legivel tambem nos tiles pequenos.
// ?opcao=a|b|c (tamanho = ?s=, padrao 1256)
import { calcularLayout } from '../src/render/layout.js';
import { desenharCenario } from '../src/render/cenario.js';
import { desenharVagao, desenharLoco, desenharSanfona, desenharEngate, desenharSombra, desenharLuzSinal, desenharMao, pontaChamine, caminhoRet, PINTURAS } from '../src/render/pecas.js';
import { TEMAS } from '../src/render/tema.js';
import { criarCarga } from '../src/render/fisica.js';
import { criarRng } from '../src/core/rng.js';

const q = new URLSearchParams(location.search);
const opcao = q.get('opcao') || 'a';
const S = Math.max(64, parseInt(q.get('s') || '1256', 10));

// cores: 0 vermelho (tanque), 2 amarelo (areia), 5 azul (tanque), 6 roxo (barris)
// cada trilho: [indice, cores paradas, vaga inicial]. Os vagoes ficam
// encostados no para-choque. origem: o bloco saiu da boca dela (sobra o resto);
// destino: ja tem na boca um vagao da cor do bloco, que vai engatar na frente
// dele; pronto: o trem completo com a locomotiva
// sem o predio da estacao: o bloco no ar voa sobre o ceu limpo. escala: o
// bloco no ar fica maior (mais perto da camera) para ser o objeto principal
const OPCOES = {
  // dia na campina: bloco de areia contra o ceu azul
  a: { tema: 'campina', escala: 1.3, origem: [0, [5], 2], destino: [1, [2], 2], pronto: [2, [0, 0, 0], 0], bloco: [2, 2] },
  // por do sol (a paleta da thumb v2): bloco de areia contra o ceu roxo e rosa
  b: {
    tema: 'campina', escala: 1.3, origem: [0, [5], 2], destino: [1, [2], 2], pronto: [2, [0, 0, 0], 0], bloco: [2, 2],
    ceu: ['#3B1E6E', '#C2457A', '#FF9E5E'], horizonte: { forma: 'morros', longe: '#9A4C86', perto: '#5A2E63' }, nuvens: 0,
    luz: '#FF8A5C',
  },
  // noite de festa: o mais contrastado com o site claro da Poki
  c: { tema: 'festa', escala: 1.3, origem: [0, [2], 2], destino: [1, [5], 2], pronto: [2, [0, 0, 0], 0], bloco: [5, 5] },
};
const K = OPCOES[opcao] || OPCOES.a;
// ceu limpo atras do bloco: sem sol nem lua (pedido do usuario na v2), sem o
// marco do mundo e sem o halo dos postes
const tema = { ...TEMAS[K.tema], astro: null, marco: null, luzes: false };
for (const k of ['ceu', 'horizonte', 'nuvens']) if (K[k] !== undefined) tema[k] = K[k];

// a cena e montada num quadrado virtual de V px e ampliada para S
const V = 500;
const dpr = S / V;
const lay = calcularLayout({ W: V, H: V, topo: 70, base: V, n: 3, cap: 3, margem: 6 });
lay.fachada.alt = 0;
const L = lay.L, P = lay.P;
const r = criarRng(7);

const cv = document.getElementById('c');
cv.width = S; cv.height = S;
const ctx = cv.getContext('2d');
ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
ctx.drawImage(desenharCenario(lay, tema, dpr), 0, 0, V, V);

const carga = (cor, o = {}) => Object.assign(criarCarga(cor), { t: 1.3 + cor * 0.7, tilt: 0, tiltV: 0, bob: 0, jolt: 0, rot: 0 }, o);

/** Realce do trilho (igual ao da cena, mais forte para ler no tile pequeno). */
function realce(i, cor, forca) {
  const t = lay.trilhos[i];
  ctx.save();
  caminhoRet(ctx, t.xIni - L * 0.04, t.yb - L * 0.3, t.xFim - t.xIni + L * 0.08, L * 0.44, L * 0.12);
  ctx.fillStyle = cor;
  ctx.globalAlpha = 0.12 + 0.18 * forca;
  ctx.fill();
  ctx.strokeStyle = cor;
  ctx.lineWidth = L * 0.045;
  ctx.globalAlpha = 0.45 + 0.45 * forca;
  ctx.stroke();
  ctx.restore();
}

/** Fila de vagoes parados num trilho, a partir da vaga s0. */
function fila(i, cores, s0, fis) {
  const t = lay.trilhos[i];
  const xs = cores.map((_, k) => lay.xVaga(i, s0 + k));
  xs.forEach((x) => desenharSombra(ctx, x, t.yb, L, 1, tema));
  for (let k = 0; k + 1 < cores.length; k++) {
    if (cores[k] === cores[k + 1]) desenharSanfona(ctx, xs[k] + L / 2, xs[k + 1] - L / 2, t.yb, L, cores[k], tema);
    else desenharEngate(ctx, xs[k] + L / 2, xs[k + 1] - L / 2, t.yb, L);
  }
  cores.forEach((c, k) => desenharVagao(ctx, xs[k], t.yb, c, L, tema, dpr, { roda: 0.5 + k, fis: fis ? fis(c, k) : carga(c) }));
  return xs;
}

const [iOrig, coresOrig, sOrig] = K.origem;
const [iDest, coresDest, sDest] = K.destino;
const [iPronto, coresPronto, sPronto] = K.pronto;
const tO = lay.trilhos[iOrig], tD = lay.trilhos[iDest], tP = lay.trilhos[iPronto];

// destino brilhando (o arraste valido do jogo)
realce(iDest, '#7CFFB2', 1);

// sinais: verde so no trem pronto
lay.trilhos.forEach((t, i) => desenharLuzSinal(ctx, t.xSinal, t.yb, L, i === iPronto, tema));

// trilho por trilho, de cima para baixo (ordem de profundidade)
for (let i = 0; i < lay.trilhos.length; i++) {
  if (i === iOrig) fila(iOrig, coresOrig, sOrig, (c) => carga(c, { tilt: -0.3, jolt: 0.4 }));
  if (i === iDest) {
    fila(iDest, coresDest, sDest);
    // fantasma onde o bloco vai engatar: na boca, encostado no que ja esta la
    K.bloco.forEach((c, k) => desenharVagao(ctx, lay.xVaga(iDest, sDest - K.bloco.length + k), tD.yb, c, L, tema, dpr, { alfa: 0.45 }));
  }
  if (i === iPronto) {
    desenharSombra(ctx, tP.xLoco, tP.yb, lay.Lg, 1, tema);
    desenharLoco(ctx, tP.xLoco, tP.yb, L, tema, dpr, { aceso: true, roda: 0.7, pintura: PINTURAS[0] });
    fila(iPronto, coresPronto, sPronto);
  }
}

// fumaca da locomotiva pronta: circulos chapados subindo
const ch = pontaChamine(tP.xLoco, tP.yb, L);
for (let k = 7; k >= 0; k--) {
  const u = k / 7;
  const x = ch.x + u * L * 0.55 + Math.sin(u * 5) * L * 0.08;
  const y = ch.y - u * L * 1.25;
  ctx.fillStyle = tema.noite ? `rgba(225,220,250,${0.92 - u * 0.5})` : `rgba(255,255,255,${0.95 - u * 0.5})`;
  ctx.beginPath();
  ctx.arc(x, y, L * (0.07 + u * 0.15), 0, Math.PI * 2);
  ctx.fill();
}

// bloco no ar: logo acima da vaga de onde saiu, meio passo adiante, inclinado
// no embalo, com o brilho de "levantado" e a carga jogada para tras
const nB = K.bloco.length;
const xAr = lay.xVaga(iOrig, (nB - 1) / 2) + P * 0.45;
const yAr = tO.yb - L * 1.05;
const ang = -0.08;
const La = L * K.escala, Pa = P * K.escala;
const xsAr = K.bloco.map((_, k) => xAr + (k - (nB - 1) / 2) * Pa);
// sombra do bloco na vaga vazia da origem
for (const x of xsAr) desenharSombra(ctx, x - P * 0.3, tO.yb, L, 0.45, tema);
ctx.save();
ctx.translate(xAr, yAr);
ctx.rotate(ang);
ctx.translate(-xAr, -yAr);
for (let k = 0; k + 1 < nB; k++) desenharSanfona(ctx, xsAr[k] + La / 2, xsAr[k + 1] - La / 2, yAr, La, K.bloco[k], tema);
K.bloco.forEach((c, k) => desenharVagao(ctx, xsAr[k], yAr, c, La, tema, dpr, { roda: 1.2 + k, brilho: 1, noAr: true, fis: carga(c, { tilt: 0.45, jolt: 1, rot: 1.1, t: 2.2 + k }) }));
// graos de areia saltando da carga
if (K.bloco[0] === 2) {
  ctx.fillStyle = '#F5C933';
  for (let i = 0; i < 22; i++) {
    const px = xsAr[0] - La * 0.6 + r() * (xsAr[nB - 1] - xsAr[0] + La * 1.1);
    const py = yAr - La * 0.84 - r() * La * 0.42;
    const s = L * (0.025 + r() * 0.03);
    ctx.fillRect(px, py, s, s);
  }
}
// tracos de movimento atras do bloco (ele vai para a direita e para baixo)
ctx.strokeStyle = 'rgba(255,255,255,0.85)';
ctx.lineCap = 'round';
ctx.lineWidth = L * 0.05;
for (const [dy, w] of [[-0.62, 0.42], [-0.4, 0.6], [-0.18, 0.36]]) {
  const x1 = xsAr[0] - La * 0.72, y1 = yAr + dy * La;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - w * L, y1 - w * L * 0.22);
  ctx.stroke();
}
ctx.restore();

// mao segurando o bloco pela frente (o corpo da mao cai sobre a vaga vazia)
desenharMao(ctx, xsAr[0] + La * 0.05, yAr - La * 0.3, La / 40, true);

ctx.setTransform(1, 0, 0, 1, 0, 0);
// luz do por do sol esquentando o patio cinza
if (K.luz) {
  ctx.globalCompositeOperation = 'soft-light';
  ctx.fillStyle = K.luz;
  ctx.globalAlpha = 0.35;
  ctx.fillRect(0, 0, S, S);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}
// vinheta suave para segurar o olhar no centro
const vg = ctx.createRadialGradient(S * 0.5, S * 0.48, S * 0.34, S * 0.5, S * 0.5, S * 0.8);
vg.addColorStop(0, 'rgba(0,0,0,0)');
vg.addColorStop(1, 'rgba(0,0,0,0.22)');
ctx.fillStyle = vg;
ctx.fillRect(0, 0, S, S);
document.title = 'pronto';
</script></body></html>
