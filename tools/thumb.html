<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>thumb</title>
<style>html,body{margin:0;overflow:hidden;background:#000}canvas{display:block;width:100vw;height:100vh}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Thumb da Poki desenhada com as pecas do proprio jogo (quase 3D, cargas com
// fisica congelada no meio do arranque). Regras (developers.poki.com/guide/
// game-thumbnail): 1:1, sangrada, sem texto, um objeto principal, sugerir
// movimento, contraste com o fundo #83FFE7 do site. ?opcao=a|b|c (tamanho = janela)
import { desenharVagao, desenharLoco, desenharSanfona, desenharEngate, desenharSombra, PINTURAS, caminhoRet } from '../src/render/pecas.js';
import { TEMAS } from '../src/render/tema.js';
import { criarCarga } from '../src/render/fisica.js';
import { criarRng } from '../src/core/rng.js';

const q = new URLSearchParams(location.search);
const opcao = q.get('opcao') || 'b';
const S = Math.max(64, parseInt(q.get('s') || '1256', 10));
const cv = document.getElementById('c');
cv.width = S; cv.height = S;
const ctx = cv.getContext('2d');
const r = criarRng(42);
const CEUS = {
  a: { ceu: ['#4C9FE6', '#8FCBF2', '#DCEFF8'], morros: ['#A9D9AE', '#6DB873'], chao: '#79B86A', tema: TEMAS.campina, sol: '#FFE68A' },
  b: { ceu: ['#3B1E6E', '#C2457A', '#FF9E5E'], morros: ['#7A3D78', '#4A2653'], chao: '#3E2A5C', tema: TEMAS.campina, sol: '#FFD37A' },
  c: { ceu: ['#120F33', '#2B1E5C', '#5B3B7C'], morros: ['#352C62', '#221C48'], chao: '#1E2446', tema: TEMAS.festa, sol: '#FFF1C4' },
};
const K = CEUS[opcao];
const tema = K.tema;

// ---- ceu, astro, morros
let gr = ctx.createLinearGradient(0, 0, 0, S * 0.7);
gr.addColorStop(0, K.ceu[0]); gr.addColorStop(0.55, K.ceu[1]); gr.addColorStop(1, K.ceu[2]);
ctx.fillStyle = gr; ctx.fillRect(0, 0, S, S);
if (opcao === 'c') { for (let i = 0; i < 140; i++) { ctx.globalAlpha = 0.3 + r() * 0.7; ctx.fillStyle = '#fff'; const s = r() < 0.1 ? 3 : 1.6; ctx.fillRect(r() * S, r() * S * 0.5, s, s); } ctx.globalAlpha = 1; }
const sx = S * 0.7, sy = S * 0.27, sr = S * 0.13;
const halo = ctx.createRadialGradient(sx, sy, sr, sx, sy, sr * 3);
halo.addColorStop(0, 'rgba(255,255,255,0.3)'); halo.addColorStop(1, 'rgba(255,255,255,0)');
ctx.fillStyle = halo; ctx.fillRect(0, 0, S, S);
ctx.fillStyle = K.sol; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, Math.PI * 2); ctx.fill();
function morros(y0, cor, alt, fase, freq) {
  ctx.fillStyle = cor; ctx.beginPath(); ctx.moveTo(0, y0 + 2);
  for (let x = 0; x <= S; x += 6) { const t = x / S; ctx.lineTo(x, y0 - alt * (0.55 + 0.3 * Math.sin(t * Math.PI * freq + fase) + 0.15 * Math.sin(t * Math.PI * freq * 2.7 + fase * 2))); }
  ctx.lineTo(S, y0 + 2); ctx.closePath(); ctx.fill();
}
morros(S * 0.62, K.morros[0], S * 0.12, 0.3, 2.0);
// estacao em silhueta no morro de tras
ctx.fillStyle = K.morros[1];
ctx.fillRect(S * 0.08, S * 0.5, S * 0.3, S * 0.1);
ctx.beginPath(); ctx.moveTo(S * 0.06, S * 0.5); ctx.lineTo(S * 0.12, S * 0.44); ctx.lineTo(S * 0.34, S * 0.44); ctx.lineTo(S * 0.4, S * 0.5); ctx.closePath(); ctx.fill();
ctx.fillStyle = opcao === 'a' ? '#F3EBDD' : '#FFD36B';
for (const q of [0.12, 0.18, 0.28, 0.34]) ctx.fillRect(S * q, S * 0.53, S * 0.025, S * 0.035);
morros(S * 0.66, K.morros[1], S * 0.07, 1.9, 3.2);
ctx.fillStyle = K.chao; ctx.fillRect(0, S * 0.66, S, S);

// ---- linhas de velocidade
ctx.strokeStyle = 'rgba(255,255,255,0.45)';
ctx.lineCap = 'round';
for (let i = 0; i < 9; i++) {
  const y = S * (0.22 + r() * 0.5), x = S * (0.05 + r() * 0.5), w = S * (0.1 + r() * 0.2);
  ctx.lineWidth = S * (0.004 + r() * 0.004);
  ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y - w * 0.3); ctx.stroke();
}

// ---- o trem em diagonal, arrancando para a direita (subindo)
const ang = -0.3;
const L = S * 0.18;
const P = L * 1.1;
const x0 = S * 0.29, y0 = S * 0.78;
ctx.save();
ctx.translate(x0, y0);
ctx.rotate(ang);
// placa do patio e trilho
ctx.fillStyle = 'rgba(0,0,0,0.3)';
ctx.fillRect(-S, -L * 0.2, S * 3, L * 0.9);
ctx.fillStyle = '#3A3F44';
caminhoRet(ctx, -S, -L * 0.27, S * 3, L * 0.37, L * 0.06); ctx.fill();
ctx.fillStyle = '#4A5056';
for (let x = -S; x < S * 2; x += L * 0.33) ctx.fillRect(x, -L * 0.22, L * 0.08, L * 0.27);
for (const yy of [-L * 0.16 - L * 0.035, 0]) { ctx.fillStyle = '#5A5F66'; ctx.fillRect(-S, yy + L * 0.02, S * 3, L * 0.03); ctx.fillStyle = '#B9BFCC'; ctx.fillRect(-S, yy, S * 3, L * 0.035); }
const cores = [0, 2, 6];
const xs = cores.map((c, i) => 1.32 * L / 2 + L * 0.1 + P / 2 + i * P);
desenharSombra(ctx, 0, 0, L * 1.3, 1, tema);
xs.forEach((xx) => desenharSombra(ctx, xx, 0, L, 1, tema));
for (let i = 0; i + 1 < cores.length; i++) desenharEngate(ctx, xs[i] + L / 2, xs[i + 1] - L / 2, 0, L);
xs.forEach((xx, i) => {
  const f = criarCarga(cores[i]);
  // arranque: liquido jogado para tras, areia saltando, barris rolando
  f.tilt = 0.42; f.tiltV = 1.5; f.jolt = 0.9; f.rot = 0.9; f.t = 2.1;
  desenharVagao(ctx, xx, 0, cores[i], L, tema, 1, { roda: 0.4 + i, fis: f });
});
desenharLoco(ctx, 0, 0, L, tema, 1, { aceso: true, roda: 0.9, pintura: PINTURAS[0] });
// faiscas nas rodas (patinando)
ctx.strokeStyle = '#FFD65A'; ctx.lineWidth = S * 0.004; ctx.lineCap = 'round';
for (let i = 0; i < 10; i++) { const a = -Math.PI * (0.2 + r() * 0.6); const d = L * (0.1 + r() * 0.3); ctx.beginPath(); ctx.moveTo(L * 0.18, -L * 0.05); ctx.lineTo(L * 0.18 + Math.cos(a) * d, -L * 0.05 + Math.sin(a) * d); ctx.stroke(); }
// graos de areia voando do segundo vagao
ctx.fillStyle = '#F5C933';
for (let i = 0; i < 16; i++) { const px = xs[1] + (r() - 0.5) * L * 0.9, py = -L * 0.75 - r() * L * 0.35; const s = L * (0.02 + r() * 0.02); ctx.fillRect(px, py, s, s); }
ctx.restore();

// ---- fumaca: circulos chapados subindo para tras (esquerda)
const cx = x0 + Math.cos(ang) * (-0.415 * L) - Math.sin(ang) * (-0.86 * L);
const cy = y0 + Math.sin(ang) * (-0.415 * L) + Math.cos(ang) * (-0.86 * L);
for (let i = 9; i >= 0; i--) {
  const t = i / 9;
  const px = cx - t * S * 0.3 + Math.sin(t * 6) * S * 0.02, py = cy - t * S * 0.34;
  const rr = S * (0.025 + t * 0.055);
  ctx.fillStyle = `rgba(255,255,255,${0.92 - t * 0.6})`;
  ctx.beginPath(); ctx.arc(px, py, rr, 0, Math.PI * 2); ctx.fill();
}
// vinheta suave para segurar o olhar no trem
const vg = ctx.createRadialGradient(S * 0.45, S * 0.6, S * 0.3, S * 0.5, S * 0.55, S * 0.85);
vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.28)');
ctx.fillStyle = vg; ctx.fillRect(0, 0, S, S);
document.title = 'pronto';
</script></body></html>
